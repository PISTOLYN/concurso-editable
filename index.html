<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concurso editable</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#071a3d;--ink:#fff;--panel:#0c2a5e;--line:#2f9bff;--gold:#ffc83d;--brown:#06173a;
  --bad:#e5251f;--btn:#ffc83d;--btnInk:#06173a;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:800 18px/1.3 Nunito,system-ui,sans-serif;background:#000}

/* Marquesina */
.marq{overflow:hidden;white-space:nowrap;background:var(--gold);color:#06173a;padding:6px 0;font-weight:800;position:relative;z-index:1}
.marq span{display:inline-block;padding-left:100%;animation:mq 22s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}

/* Título */
main{max-width:1200px;margin:0 auto;padding:12px;position:relative;z-index:1}
.ttl{position:relative;margin:6px auto 18px;max-width:820px;text-align:center;padding:10px 60px;border-radius:50%/60%;background:linear-gradient(#e0151f,#a30a14);border:5px solid var(--gold);box-shadow:0 0 0 3px #ff8a00,0 0 30px rgba(255,200,60,.7);color:#fff;font:400 clamp(24px,5vw,48px)/1.1 "Bowlby One",Nunito,sans-serif;text-shadow:0 3px 0 #1a3fa0,0 0 14px rgba(255,255,255,.35)}
.ttl::before,.ttl::after{content:"★";position:absolute;top:50%;transform:translateY(-50%);color:var(--gold);font-size:.8em;text-shadow:0 2px 0 #b34100}
.ttl::before{left:18px}.ttl::after{right:18px}

/* --- TABLERO CON IMAGEN --- */
.stage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background-image: url('./tablero-fondo.png');
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
  margin-bottom: 20px;
}

.board-overlay {
  position: absolute;
  top: 22%; left: 24%; right: 24%; bottom: 22%;
  display: flex; flex-direction: column;
}

.qs {
  background: transparent; border: none; color: #fff;
  text-shadow: 2px 2px 4px #000; text-align: center;
  margin-bottom: 2%; font: 400 clamp(14px, 2vw, 24px)/1.2 "Bowlby One",Nunito,sans-serif;
}

#bd { display: flex; flex-direction: column; gap: 2%; flex: 1; }

.tile {
  background: transparent; border: none; box-shadow: none;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; color: #fff; min-height: 0; padding: 0 2%;
}
.tile .n { display: none; }
.tile .l { font: 400 clamp(14px, 2.5vw, 28px)/1 "Bowlby One",Nunito,sans-serif; text-shadow: 2px 2px 4px #000; text-align: left; width: 70%; }
.tile .p { background: transparent; border: none; color: #ffc83d; text-shadow: 2px 2px 4px #000; font-size: clamp(16px, 2.5vw, 28px); display: none; }
.tile .p small { display: none; }
.tile.open .l { color: #ffc83d; }
.tile.open .p { display: block; }

.lights { position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); z-index: 10; }
.bankp { position: absolute; top: 2%; right: 24%; color: #fff; text-shadow: 2px 2px 4px #000; font-size: 18px; z-index: 10;}
.bankp span { font: 400 24px "Bowlby One",sans-serif; color: #ffc83d; }

.score-overlay { position: absolute; top: 0; width: 100%; height: 100%; pointer-events: none; }
.score-box { position: absolute; width: 12%; height: 10%; display: flex; align-items: center; justify-content: center; font: 400 clamp(20px, 4vw, 48px)/1 "Bowlby One",sans-serif; color: #fff; text-shadow: 2px 2px 4px #000; }
.score-azul { top: 36%; left: 6%; }
.score-rojo { top: 36%; right: 6%; }

/* Panel de control inferior */
.cap{margin:16px 0 12px;min-height:52px;padding:10px 14px;border-left:8px solid var(--gold);background:rgba(6,23,58,.82);border-radius:8px;font-size:clamp(18px,2.6vw,26px)}
.bar{display:flex;flex-wrap:wrap;gap:8px}
button.b{background:var(--btn);color:var(--btnInk);border:0;border-radius:10px;padding:12px 16px;font:800 17px Nunito,system-ui,sans-serif;cursor:pointer;min-height:48px}
button.b.alt{background:rgba(6,23,58,.7);color:var(--ink);border:2px solid var(--line)}
button.b.red{background:var(--bad);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tile:focus-visible{outline:4px solid #fff;outline-offset:2px}

.x{position:fixed;inset:0;display:none;place-items:center;font:400 40vmin/1 "Bowlby One",sans-serif;color:var(--bad);background:rgba(0,0,0,.45);pointer-events:none;z-index:20}
.x.on{display:grid}
.x i{position:relative;width:46vmin;height:46vmin}
.x i::before,.x i::after{content:"";position:absolute;left:50%;top:50%;width:100%;height:24%;margin:-12% 0 0 -50%;border-radius:999px;background:#ff6200;box-shadow:0 0 40px rgba(255,98,0,.8)}
.x i::before{transform:rotate(45deg)}
.x i::after{transform:rotate(-45deg)}

#menu{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:30;overflow:auto;padding:12px}
#menu.on{display:block}
.pan{max-width:760px;margin:0 auto;background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:16px}
.pan h2{margin:0 0 8px;font:400 24px "Bowlby One",Nunito,sans-serif}
.pan h3{margin:18px 0 6px}
.pan label{display:block;margin:8px 0 4px;font-weight:800}
.pan input[type=text],.pan textarea,.pan select{width:100%;font:600 16px Nunito,system-ui,sans-serif;padding:9px;border-radius:8px;border:2px solid var(--line);background:var(--brown);color:var(--ink)}
.pan textarea{min-height:150px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.msg{margin-top:8px;font-weight:800;color:#ff9a9a}
.hint{font-weight:600;opacity:.9;font-size:15px}

.strikes{display:flex;gap:14px;padding:6px 18px;border-radius:30px;background:rgba(6,23,58,.8);border:3px solid var(--gold)}
.strikes i{position:relative;width:50px;height:50px;border-radius:50%;border:5px solid var(--gold);background:#4a0c14;font-size:0;color:transparent;overflow:hidden}
.strikes i::before,.strikes i::after{content:"";position:absolute;left:50%;top:50%;width:80%;height:22px;margin:-11px 0 0 -40%;border-radius:11px;background:#ffd21f;opacity:.22}
.strikes i::before{transform:rotate(45deg)}
.strikes i::after{transform:rotate(-45deg)}
.strikes i.on{background:radial-gradient(circle at 35% 30%,#ff5a5a,#c4101a);box-shadow:0 0 18px 4px rgba(255,60,60,.8)}
.strikes i.on::before,.strikes i.on::after{opacity:1;box-shadow:0 0 0 2px #7a0a10,0 0 8px #fff3b0}

.dock{display:none;position:fixed;left:0;right:0;bottom:0;z-index:15;max-height:46vh;overflow:auto;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(6,15,40,.95);border-top:4px solid var(--gold)}
.dock.on{display:block}
body.dockon main{padding-bottom:42vh}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:30;align-items:center;justify-content:center;padding:12px;overflow:auto}
.ov.on{display:flex}
.hubp{width:min(1000px,100%);background:#0c0c0c;border:3px solid #d4af37;padding:18px 22px 24px;text-align:center}
.hsub{color:#f0d77a;font-weight:800;font-size:18px;text-transform:uppercase}
.hh{margin:0 0 16px;color:#d4af37;font:800 clamp(30px,5vw,44px) Nunito,system-ui,sans-serif}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hb{background:#1d1d1d;border:2px solid #d4af37;color:#d4af37;padding:18px 10px;font:800 clamp(15px,2.2vw,20px) Nunito,system-ui,sans-serif;text-transform:uppercase;cursor:pointer}
.hb:hover{background:#2c2c2c}
.hb:focus-visible{outline:4px solid #fff;outline-offset:2px}
@media(max-width:700px){.hg{grid-template-columns:1fr}.stage{aspect-ratio: auto; min-height: 400px} .board-overlay {top: 15%; bottom: 15%;}}
</style>
</head>
<body>
<div class="marq" id="mq"><span id="mqt"></span></div>
<main>
  <div class="ttl" id="ttl"></div>
  
  <div class="stage">
    <div class="score-overlay">
      <div class="score-box score-azul" id="s0">0</div>
      <div class="score-box score-rojo" id="s1">0</div>
    </div>

    <div class="board-overlay">
      <div class="qs" id="q"></div>
      <div id="bd"></div>
    </div>

    <div class="lights"><div class="strikes" id="st"></div></div>
    <div class="bankp">Banco: <span id="bk">0</span></div>
  </div>

  <div class="cap" id="cap" aria-live="polite">Pulsa M para abrir el menú y los controles del juego.</div>
  
  <div class="dock" id="dock"><div class="bar">
    <button class="b" id="bRead">Leer pregunta (L)</button>
    <button class="b" id="bNext1">Revelar siguiente (Espacio)</button>
    <button class="b red" id="bErr">Error (X)</button>
    <button class="b alt" id="bClr">Reiniciar las X (C)</button>
    <button class="b" id="bA0">Banco al equipo azul</button>
    <button class="b" id="bA1">Banco al equipo rojo</button>
    <button class="b alt" id="bUnlock">Habilitar pulsadores (R)</button>
    <button class="b alt" id="bAll">Mostrar todas</button>
    <button class="b alt" id="bQ">Siguiente pregunta (→)</button>
    <button class="b alt" id="bFs">Pantalla completa (F)</button>
    <button class="b alt" id="bMenu">Menú (M)</button>
    <button class="b alt" id="bHide">Ocultar panel</button>
  </div>
  <p class="hint" id="keys"></p></div>
</main>
<div class="x" id="xx"><i></i></div>

<div id="hub" class="ov" role="dialog" aria-label="Menú"><div class="hubp">
  <div class="hsub" id="hsub"></div><h2 class="hh">MENÚ</h2>
  <div class="hg">
    <button class="hb" id="hCtl">Panel del conductor</button>
    <button class="hb" id="hQ">Editar preguntas</button>
    <button class="hb" id="hEv">Nombre del evento</button>
    <button class="hb" id="hKey">Configurar teclado</button>
    <button class="hb" id="hVoz">Voz del conductor</button>
    <button class="hb" id="hFs">Pantalla completa</button>
    <button class="hb" id="hClose">Cerrar menú</button>
    <button class="hb" id="hExit">Cerrar programa</button>
  </div></div></div>
<div id="menu" role="dialog" aria-label="Menú de administración"><div class="pan">
  <h2>Menú de administración</h2>
  <h3 id="sPreg">Preguntas</h3>
  <label for="sel">Pregunta a editar</label><select id="sel"></select>
  <label for="eq">Texto de la pregunta</label><input type="text" id="eq">
  <label for="ea">Respuestas, una por línea: respuesta | puntos (máximo 8)</label><textarea id="ea"></textarea>
  <div class="row"><button class="b" id="eSave">Guardar pregunta</button><button class="b alt" id="eNew">Nueva pregunta</button><button class="b alt" id="eDup">Duplicar</button><button class="b red" id="eDel">Eliminar</button></div>
  <div class="msg" id="emsg" role="status"></div>
  <h3 id="sVoz">Voz</h3>
  <label><input type="checkbox" id="vOn"> El conductor virtual habla preguntas y respuestas</label>
  <label for="vSel">Voz</label><select id="vSel"></select>
  <label for="vRate">Velocidad</label><input type="range" id="vRate" min="0.6" max="1.4" step="0.1" value="1">
  <div class="row"><button class="b alt" id="vTest">Probar voz</button></div>
  <h3 id="sMq">Nombre del evento y marquesina</h3>
  <label for="mqIn">Mensaje superior</label><input type="text" id="mqIn">
  <label for="ttIn">Nombre del evento (título)</label><input type="text" id="ttIn">
  <h3 id="sKeys">Configurar teclado</h3>
  <div class="row"><span id="k0"></span><button class="b alt" id="kc0">Cambiar tecla</button><span id="k1"></span><button class="b alt" id="kc1">Cambiar tecla</button></div>
  <div class="row"><span id="k2"></span><button class="b alt" id="kc2">Cambiar tecla</button></div>
  <div class="row"><span id="k3"></span><button class="b alt" id="kc3">Cambiar tecla</button></div>
  <div class="row"><span id="k4"></span><button class="b alt" id="kc4">Cambiar tecla</button></div>
  <div class="row"><span id="k5"></span><button class="b alt" id="kc5">Cambiar tecla</button></div>
  <div class="msg" id="kmsg" role="status"></div>
  <div class="row" style="margin-top:18px"><button class="b" id="mClose">Volver al juego (Esc)</button><button class="b alt" id="mReset">Restaurar preguntas de ejemplo</button></div>
</div></div>

<script>
var DEF=[
{q:"Menciona algo que la gente lleva en la mochila a la escuela",a:[["Cuadernos",35],["Lápices",25],["Lonche",18],["Botella de agua",12],["Libros",10]]},
{q:"Dime un platillo mexicano famoso",a:[["Tacos",40],["Mole",20],["Pozole",15],["Enchiladas",12],["Tamales",8],["Chiles en nogada",5]]},
{q:"Algo que haces al despertar",a:[["Bañarte",30],["Desayunar",25],["Cepillarte los dientes",20],["Revisar el celular",15],["Estirarte",10]]},
{q:"Una razón para llegar tarde al trabajo",a:[["Tráfico",40],["Se quedó dormido",30],["Falla del carro",15],["Lluvia",10],["Se le olvidó algo",5]]}
];
var S={qs:JSON.parse(JSON.stringify(DEF)),voice:true,vName:"",rate:1,mq:"Bienvenidos al concurso. ¡Que gane el mejor equipo!",keys:["q","p"]};
try{var raw=localStorage.getItem("concurso_v1");if(raw){var o=JSON.parse(raw);if(o&&o.qs&&o.qs.length)S=o}}catch(e){}
function save(){try{localStorage.setItem("concurso_v1",JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var NM=["azul","rojo"];
function AW(){return S.awKeys||["a","s"]}
var G={qi:0,open:[],bank:0,err:0,sc:[0,0],first:null,locked:false,ei:0,cap:-1,max:3};
var AC=null;
function tone(f,d,t,dl){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(AC.destination);var s=AC.currentTime+(dl||0);g.gain.setValueAtTime(.15,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
var voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(function(v){return /^es/i.test(v.lang)});var s=$("vSel");s.innerHTML="";voices.forEach(function(v){var o=document.createElement("option");o.value=v.name;o.textContent=v.name+" ("+v.lang+")";s.appendChild(o)});if(S.vName)s.value=S.vName}catch(e){}}
try{speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}catch(e){}
function say(t){
  $("cap").textContent=t;
  if(!S.voice||!("speechSynthesis" in window))return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="es-MX";u.rate=S.rate||1;var v=voices.filter(function(x){return x.name===S.vName})[0]||voices[0];if(v){u.voice=v;u.lang=v.lang}speechSynthesis.speak(u)}catch(e){}
}
function cur(){return S.qs[G.qi]}
function render(){
  var c=cur();$("q").textContent=c.q;
  var b=$("bd");b.innerHTML="";
  c.a.forEach(function(a,i){
    var o=G.open.indexOf(i)>-1;
    var t=document.createElement("button");t.className="tile"+(o?" open":"");
    var n=document.createElement("span"),l=document.createElement("span");n.className="n";n.textContent=i+1;l.className="l";
    l.textContent=o?a[0]:"● ● ● ● ● ● ●";t.appendChild(n);t.appendChild(l);
    if(o){var p=document.createElement("span");p.className="p";p.textContent=a[1];t.appendChild(p)}
    t.onclick=function(){reveal(i)};b.appendChild(t)});
  var st=$("st");st.innerHTML="";for(var k=0;k<G.max;k++){var i=document.createElement("i");i.textContent="✕";if(k<G.err)i.className="on";st.appendChild(i)}
  
  $("s0").textContent=G.sc[0];$("s1").textContent=G.sc[1];$("bk").textContent=G.bank;
  
  $("ttl").textContent=S.title||"CONCURSO EN VIVO";$("mqt").textContent=S.mq||"";$("bErr").textContent="Error ("+(S.errKey||"x").toUpperCase()+")";$("bClr").textContent="Reiniciar las X ("+(S.clrKey||"c").toUpperCase()+")";$("bA0").textContent="Banco al equipo azul ("+AW()[0].toUpperCase()+")";$("bA1").textContent="Banco al equipo rojo ("+AW()[1].toUpperCase()+")";$("mq").style.display=S.mq?"":"none";
  $("keys").textContent="Pulsadores: azul = "+S.keys[0].toUpperCase()+", rojo = "+S.keys[1].toUpperCase()+". Error = "+(S.errKey||"x").toUpperCase()+". Reiniciar X = "+(S.clrKey||"c").toUpperCase()+". Puntos: azul = "+AW()[0].toUpperCase()+", rojo = "+AW()[1].toUpperCase()+". Teclas 1–8 revelan respuestas.";
}
function reveal(i){
  var a=cur().a[i];if(!a||G.open.indexOf(i)>-1)return;
  G.open.push(i);G.bank+=a[1];tone(880,.15);tone(1320,.3,"sine",.15);
  render();say("Respuesta "+(i+1)+": "+a[0]+". "+a[1]+" puntos.");
}
function revealNext(){for(var i=0;i<cur().a.length;i++){if(G.open.indexOf(i)<0){reveal(i);return}}say("Ya están todas las respuestas reveladas.")}
function revealAll(){cur().a.forEach(function(_,i){if(G.open.indexOf(i)<0)G.open.push(i)});render();say("Estas eran todas las respuestas.")}
function error(){
  G.err=Math.min(G.err+1,G.max);tone(140,.6,"sawtooth");
  var x=$("xx");x.className="x on";setTimeout(function(){x.className="x"},800);render();
  say(G.err>=G.max?"Error. Son tres errores, pasa el turno al otro equipo.":"Error. Llevan "+G.err+(G.err===1?" error.":" errores."));
}
function clearErr(){G.err=0;render();say("Errores reiniciados.")}
function award(t){var n=G.bank;G.sc[t]+=n;G.bank=0;tone(660,.2);tone(990,.4,"sine",.2);render();say("El equipo "+NM[t]+" gana "+n+" puntos. Marcador: "+G.sc[0]+" a "+G.sc[1]+".")}
function buzz(t){if(G.locked)return;G.locked=true;G.first=t;tone(600,.25,"square");render();say("¡Equipo "+NM[t]+" respondió primero!")}
function unlock(){G.locked=false;G.first=null;render();say("Pulsadores habilitados.")}
function readQ(){say(cur().q+". Hay "+cur().a.length+" respuestas en el tablero.")}
function nextQ(){G.qi=(G.qi+1)%S.qs.length;G.open=[];G.bank=0;G.first=null;G.locked=false;render();readQ()}
function fs(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}}
function hub(on){$("hub").className=on?"ov on":"ov";if(on)$("hsub").textContent=S.title||"CONCURSO EN VIVO"}
function dock(on){$("dock").className=on?"dock on":"dock";document.body.classList.toggle("dockon",on)}
function openEd(id){hub(false);menu(true);var el=$(id);if(el)el.scrollIntoView()}
function menu(on){$("menu").className=on?"on":"";if(on){fillMenu()}else{cap=null;render()}}
var cap=null;
function fillMenu(){
  var s=$("sel");s.innerHTML="";S.qs.forEach(function(q,i){var o=document.createElement("option");o.value=i;o.textContent=(i+1)+". "+q.q.slice(0,60);s.appendChild(o)});
  if(G.ei>=S.qs.length)G.ei=S.qs.length-1;s.value=G.ei;loadEd();
  $("vOn").checked=S.voice;$("vRate").value=S.rate;$("mqIn").value=S.mq;$("ttIn").value=S.title||"CONCURSO EN VIVO";loadVoices();
  $("k0").textContent="Azul: "+S.keys[0].toUpperCase();$("k1").textContent="Rojo: "+S.keys[1].toUpperCase();$("k2").textContent="Error: "+(S.errKey||"x").toUpperCase();$("k3").textContent="Reiniciar las X: "+(S.clrKey||"c").toUpperCase();$("k4").textContent="Puntos al equipo azul: "+AW()[0].toUpperCase();$("k5").textContent="Puntos al equipo rojo: "+AW()[1].toUpperCase();
}
function loadEd(){var q=S.qs[G.ei];$("eq").value=q.q;$("ea").value=q.a.map(function(a){return a[0]+" | "+a[1]}).join("\n");$("emsg").textContent=""}
function parseEd(){
  var q=$("eq").value.trim();if(!q)return{err:"Escribe el texto de la pregunta."};
  var out=[],ls=$("ea").value.split("\n");
  for(var i=0;i<ls.length;i++){var l=ls[i].trim();if(!l)continue;var p=l.lastIndexOf("|");if(p<1)return{err:"La línea "+(i+1)+" necesita el formato: respuesta | puntos."};
    var n=parseInt(l.slice(p+1),10);if(!(n>0))return{err:"La línea "+(i+1)+" tiene puntos inválidos."};out.push([l.slice(0,p).trim(),n])}
  if(!out.length)return{err:"La pregunta necesita al menos una respuesta."};
  if(out.length>8)return{err:"El máximo es de 8 respuestas."};
  return{v:{q:q,a:out}}
}
$("sel").onchange=function(){G.ei=+this.value;loadEd()};
$("eSave").onclick=function(){var r=parseEd();if(r.err){$("emsg").textContent=r.err;return}S.qs[G.ei]=r.v;save();if(G.ei===G.qi){G.open=[];G.bank=0}fillMenu();$("emsg").textContent="Pregunta guardada."};
$("eNew").onclick=function(){S.qs.push({q:"Nueva pregunta",a:[["Respuesta 1",50],["Respuesta 2",30]]});G.ei=S.qs.length-1;save();fillMenu()};

document.addEventListener("keydown",function(e){
  var tg=e.target&&e.target.tagName,typing=/INPUT|TEXTAREA|SELECT/.test(tg||"");
  if(cap!==null&&!typing){e.preventDefault();var k=e.key.toLowerCase();if(k==="escape"){cap=null;$("kmsg").textContent="";return}
    if(k.length!==1){$("kmsg").textContent="Elige una letra o un número.";return}
    var rsv=[" ","m","r","l","f","1","2","3","4","5","6","7","8"];
    var others=[S.keys[0],S.keys[1],S.errKey||"x",S.clrKey||"c",AW()[0],AW()[1]].filter(function(_,i){return i!==cap});
    if(rsv.indexOf(k)>-1||others.indexOf(k)>-1){$("kmsg").textContent="Esa tecla ya está en uso. Elige otra.";return}
    if(cap>3){S.awKeys=AW().slice();S.awKeys[cap-4]=k}else if(cap===3)S.clrKey=k;else if(cap===2)S.errKey=k;else S.keys[cap]=k;save();cap=null;$("kmsg").textContent="Tecla guardada.";fillMenu();return}
  if(e.key==="Escape"){if($("menu").className==="on")menu(false);else if($("hub").className==="ov on")hub(false);else if($("dock").className==="dock on")dock(false);return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key.toLowerCase();
  if($("menu").className==="on")return;
  if(k==="m"){if($("hub").className==="ov on")hub(false);else if($("dock").className==="dock on")dock(false);else hub(true);return}
  if($("hub").className==="ov on")return;
  if(k===S.keys[0]){buzz(0);return}if(k===S.keys[1]){buzz(1);return}
  if(/^[1-8]$/.test(k)){reveal(+k-1);return}
  if(k===" "){e.preventDefault();revealNext()}else if(k===(S.errKey||"x"))error();else if(k===(S.clrKey||"c"))clearErr();else if(k===AW()[0])award(0);else if(k===AW()[1])award(1);else if(k==="r")unlock();else if(k==="l")readQ();else if(k==="f")fs();else if(k==="arrowright")nextQ();
});
